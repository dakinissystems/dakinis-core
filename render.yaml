# DEPRECADO — produccion en Railway (core.dakinissystems.com).
# No usar Render para Core; ver docs/RAILWAY-CORE.md y docs/RAILWAY-FRONT-VARS.md

services:
  - type: web
    name: dakinis-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start -w @dakinis/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false
      - key: SQLITE_PATH
        value: /var/data/dakinis.db
    disk:
      name: dakinis-sqlite
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: dakinis-web
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @dakinis/web
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false
